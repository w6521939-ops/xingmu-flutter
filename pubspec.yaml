name: xingmu_ai_video_studio
description: "星幕 AI 漫剧工作室 — Flutter Android & HarmonyOS 客户端，支持漫剧/口播/录屏/播客多管线 AI 视频生成。"
publish_to: 'none'
version: 2.0.0+20

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  video_player:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      ref: 97e9265ae2ab44c913d5d943ad68bec0c07a040e
      path: packages/video_player/video_player

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
    - assets/showcase/moon-courier-hero.png
