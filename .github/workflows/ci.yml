name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

  test:
    name: Flutter Test
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  build-android:
    name: Build Android (Debug)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --debug --no-pub

  license-check:
    name: License & File Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check LICENSE exists
        run: |
          if [ ! -f LICENSE ]; then
            echo "LICENSE file is missing"
            exit 1
          fi
      - name: Check README exists
        run: |
          if [ ! -f README.md ]; then
            echo "README.md is missing"
            exit 1
          fi
      - name: Check CONTRIBUTING exists
        run: |
          if [ ! -f CONTRIBUTING.md ]; then
            echo "CONTRIBUTING.md is missing"
            exit 1
          fi
      - name: Check CODE_OF_CONDUCT exists
        run: |
          if [ ! -f CODE_OF_CONDUCT.md ]; then
            echo "CODE_OF_CONDUCT.md is missing"
            exit 1
          fi
      - name: Verify no secrets in source
        run: |
          if grep -r "sk-[a-zA-Z0-9]\{20,\}" --include="*.dart" --include="*.yaml" --include="*.json" .; then
            echo "Potential API key found in source"
            exit 1
          fi
          echo "No secrets detected"
