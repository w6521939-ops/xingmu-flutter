name: 功能请求
description: 提议一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 相关问题
      description: 这个功能请求是否与某个问题相关？请描述
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: 你期望的解决方案
      description: 清楚地描述你希望实现什么功能
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你考虑过哪些其他方案
    validations:
      required: false

  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      options:
        - 主题成剧
        - 角色设定
        - 分镜生成
        - 视频生成
        - 配音工作室
        - 多轨混音
        - Agent 架构
        - Keyring 加密存储
        - 管线状态机
        - 其他
    validations:
      required: true
