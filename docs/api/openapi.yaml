openapi: 3.1.0
info:
  title: 星幕 AI 漫剧可信后端 API
  version: 0.1.0
  description: |
    Flutter Android/OpenHarmony 客户端与可信后端之间的唯一网络契约。
    模型供应商密钥只能保存在后端；客户端只持有短期用户访问令牌。
    所有创建/动作类 POST 请求必须携带 `Idempotency-Key`，所有覆盖或状态迁移请求必须携带最新 `If-Match`。
servers:
  - url: https://api.xingmu.example/v1
    description: 生产占位地址；发布前替换为实际 HTTPS 域名
security:
  - bearerAuth: []
tags:
  - name: Projects
  - name: ScriptJobs
  - name: Assets
  - name: GenerationPlans
  - name: GenerationRuns
  - name: GenerationJobs
  - name: Budget
  - name: Exports

paths:
  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: 分页列出当前用户的项目
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 项目列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Projects]
      operationId: createProject
      summary: 创建漫剧项目
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: 已创建
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Error'

  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: 获取项目
      responses:
        '200':
          description: 项目详情
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: 更新项目元数据
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: 已更新
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: 软删除项目
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: 已进入回收状态
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/Error'

  /projects/{projectId}/script-jobs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [ScriptJobs]
      operationId: createScriptJob
      summary: 根据主题或原始文本异步生成结构化剧本
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScriptJobRequest'
      responses:
        '202':
          description: 已进入任务队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptJob'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/Error'

  /script-jobs/{scriptJobId}:
    parameters:
      - $ref: '#/components/parameters/ScriptJobId'
    get:
      tags: [ScriptJobs]
      operationId: getScriptJob
      summary: 查询剧本任务及其结构化结果
      responses:
        '200':
          description: 剧本任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptJob'
        default:
          $ref: '#/components/responses/Error'

  /projects/{projectId}/assets:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Assets]
      operationId: listAssets
      summary: 列出角色、场景、道具、分镜、视频和音频资产
      parameters:
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/AssetKind'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 资产列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        default:
          $ref: '#/components/responses/Error'

  /projects/{projectId}/assets/upload-intents:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Assets]
      operationId: createAssetUploadIntent
      summary: 创建限时、限类型、限大小的直传凭证
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadIntentRequest'
      responses:
        '201':
          description: 已创建上传凭证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadIntent'
        default:
          $ref: '#/components/responses/Error'

  /assets/{assetId}/complete:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    post:
      tags: [Assets]
      operationId: completeAssetUpload
      summary: 确认上传并触发后端类型、大小与内容校验
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteUploadRequest'
      responses:
        '202':
          description: 正在校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        default:
          $ref: '#/components/responses/Error'

  /assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      tags: [Assets]
      operationId: getAsset
      summary: 获取资产元数据和限时预览地址
      responses:
        '200':
          description: 资产
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Assets]
      operationId: deleteAsset
      summary: 删除未被运行锁定的资产
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: 已删除
        '409':
          description: 资产正在被生成任务使用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/Error'

  /projects/{projectId}/generation-plans:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [GenerationPlans]
      operationId: createGenerationPlan
      summary: 固化剧本版本、角色/场景参考和镜头生成计划
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGenerationPlanRequest'
      responses:
        '201':
          description: 计划已创建
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationPlan'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/Error'

  /generation-plans/{planId}:
    parameters:
      - $ref: '#/components/parameters/PlanId'
    get:
      tags: [GenerationPlans]
      operationId: getGenerationPlan
      summary: 获取生成计划
      responses:
        '200':
          description: 生成计划
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationPlan'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [GenerationPlans]
      operationId: updateGenerationPlan
      summary: 在运行前调整镜头或供应商策略
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateGenerationPlanRequest'
      responses:
        '200':
          description: 计划已更新
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationPlan'
        '409':
          description: 计划已运行，不能原地修改
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/Error'

  /generation-plans/{planId}/runs:
    parameters:
      - $ref: '#/components/parameters/PlanId'
    post:
      tags: [GenerationRuns]
      operationId: startGenerationRun
      summary: 启动生成计划
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRunRequest'
      responses:
        '202':
          description: 运行已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationRun'
        '402':
          description: 预算不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/Error'

  /generation-runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [GenerationRuns]
      operationId: getGenerationRun
      summary: 获取整次生成的聚合状态
      responses:
        '200':
          description: 生成运行
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationRun'
        default:
          $ref: '#/components/responses/Error'

  /generation-runs/{runId}/actions:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [GenerationRuns]
      operationId: changeGenerationRunState
      summary: 暂停、恢复或取消生成
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunActionRequest'
      responses:
        '202':
          description: 状态迁移已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationRun'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/Error'

  /generation-runs/{runId}/jobs:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [GenerationJobs]
      operationId: listGenerationJobs
      summary: 列出角色图、场景图、分镜、视频、配音和导出子任务
      parameters:
        - name: stage
          in: query
          schema:
            $ref: '#/components/schemas/GenerationStage'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 子任务列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJobPage'
        default:
          $ref: '#/components/responses/Error'

  /generation-runs/{runId}/events:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - name: Last-Event-ID
        in: header
        required: false
        description: 断线重连时传入客户端最后确认的事件 ID
        schema:
          type: string
    get:
      tags: [GenerationRuns]
      operationId: streamGenerationRunEvents
      summary: 订阅运行进度 SSE
      description: |
        服务端至少发送 `run.updated`、`job.updated`、`budget.updated`、`export.updated` 和 `heartbeat`。
        访问令牌不得放入查询字符串；客户端应使用支持 Authorization 请求头的 SSE 实现。
      responses:
        '200':
          description: Server-Sent Events 流
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-cache
          content:
            text/event-stream:
              schema:
                type: string
              example: |-
                id: evt_01JABC
                event: job.updated
                data: {"runId":"run_01JABC","jobId":"job_01JABC","status":"running","progress":42}

        default:
          $ref: '#/components/responses/Error'

  /generation-jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [GenerationJobs]
      operationId: getGenerationJob
      summary: 获取单个生成子任务
      responses:
        '200':
          description: 生成子任务
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJob'
        default:
          $ref: '#/components/responses/Error'

  /generation-jobs/{jobId}/actions:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [GenerationJobs]
      operationId: changeGenerationJobState
      summary: 重试或取消单个子任务
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobActionRequest'
      responses:
        '202':
          description: 动作已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJob'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/Error'

  /projects/{projectId}/budget:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Budget]
      operationId: getProjectBudget
      summary: 获取项目预算、已预留和已消耗金额
      responses:
        '200':
          description: 项目预算
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags: [Budget]
      operationId: setProjectBudget
      summary: 设置项目硬预算上限
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBudgetRequest'
      responses:
        '200':
          description: 预算已更新
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/Error'

  /projects/{projectId}/budget/estimate:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Budget]
      operationId: estimateGenerationCost
      summary: 按计划和供应商策略预估费用
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId:
                  type: string
      responses:
        '200':
          description: 费用预估
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetEstimate'
        default:
          $ref: '#/components/responses/Error'

  /projects/{projectId}/exports:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Exports]
      operationId: listExports
      summary: 列出项目成片导出
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 导出列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Exports]
      operationId: createExport
      summary: 将已完成镜头、配音、字幕和音乐合成为 MP4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExportRequest'
      responses:
        '202':
          description: 导出已进入队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/Error'

  /exports/{exportId}:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    get:
      tags: [Exports]
      operationId: getExport
      summary: 查询成片导出状态
      responses:
        '200':
          description: 导出任务
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
        default:
          $ref: '#/components/responses/Error'

  /exports/{exportId}/actions:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    post:
      tags: [Exports]
      operationId: changeExportState
      summary: 取消或重试导出
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportActionRequest'
      responses:
        '202':
          description: 动作已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/Error'

  /exports/{exportId}/download:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    get:
      tags: [Exports]
      operationId: getExportDownload
      summary: 获取短期签名下载地址
      responses:
        '200':
          description: 限时下载信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadTicket'
        default:
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    ScriptJobId:
      name: scriptJobId
      in: path
      required: true
      schema:
        type: string
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 每次用户意图生成一个 UUID；相同用户、路由和请求体可安全重放 24 小时
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 使用最近一次 GET/创建响应返回的强 ETag，避免并发覆盖
      schema:
        type: string

  headers:
    ETag:
      description: 当前资源修订版本，例如 `"rev-7"`
      schema:
        type: string
    RequestId:
      description: 用于排障的请求 ID，不包含用户或密钥信息
      schema:
        type: string

  responses:
    Error:
      description: 请求失败
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionFailed:
      description: ETag 已过期；客户端应重新读取资源并让用户确认冲突
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Timestamp:
      type: string
      format: date-time
    JobStatus:
      type: string
      enum: [queued, running, paused, succeeded, failed, canceled]
    AssetKind:
      type: string
      enum: [character, scene, prop, storyboard, video, voice, music, subtitle, export]
    GenerationStage:
      type: string
      enum:
        - script
        - character_images
        - scene_images
        - prop_images
        - storyboard_images
        - shot_videos
        - voice_assignment
        - voice_lines
        - episode_export
    ProviderStrategy:
      type: string
      enum: [bailian, wan22, automatic]

    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500
        aspectRatio:
          type: string
          enum: ['9:16', '16:9', '1:1']
